<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Operating Analytics</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f3f2ec;--ink:#1b1b19;--ink2:#5f5e5a;--accent:#1F4E79}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--ink:#f0efe9;--ink2:#b4b2a9;--accent:#7FA8D4}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
.box{max-width:460px}
.code{font-size:64px;font-weight:600;color:var(--accent);margin:0;line-height:1}
h1{font-size:20px;font-weight:600;margin:14px 0 6px}
p{font-size:14px;color:var(--ink2);margin:0 0 20px;line-height:1.6}
a{display:inline-block;font-size:14px;font-weight:600;color:#fff;background:var(--accent);text-decoration:none;padding:9px 18px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<p class="code">404</p>
<h1>Page not found</h1>
<p>That page doesn&rsquo;t exist on this site. Head back to the analytics dashboard.</p>
<a href="./">Back to dashboard</a>
</div>
</body>
</html>
